version: 2
updates:
  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7  # Don't adopt a release until it's 7 days old.
    open-pull-requests-limit: 10

  # Python dependencies (managed with uv; uv.lock is the source of truth)
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7  # Don't adopt a release until it's 7 days old.
    open-pull-requests-limit: 10
