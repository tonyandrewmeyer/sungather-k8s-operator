name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.10'

      - name: Install tox
        run: uv tool install --with=tox-uv tox

      - name: Run linting
        run: uv run tox -e lint

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.10'

      - name: Install tox
        run: uv tool install --with=tox-uv tox

      - name: Run unit tests
        run: uv run tox -e unit

  build-rock:
    name: Build and Push Rock
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    outputs:
      rock-image: ${{ steps.metadata.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rockcraft
        run: sudo snap install rockcraft --classic

      - name: Build rock
        run: |
          cd rock
          sudo rockcraft pack --destructive-mode --verbose

      - name: Extract rock to OCI archive
        id: extract
        run: |
          cd rock
          ROCK_FILE=$(ls *.rock)
          sudo rockcraft.skopeo --insecure-policy copy oci-archive:${ROCK_FILE} docker-archive:sungather.tar
          sudo chown $USER:$USER sungather.tar
          echo "archive=rock/sungather.tar" >> $GITHUB_OUTPUT

      - name: Generate image metadata
        id: metadata
        env:
          REPO_OWNER: ${{ github.repository_owner }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GIT_REF: ${{ github.ref }}
          GIT_SHA: ${{ github.sha }}
        run: |
          IMAGE_NAME="ghcr.io/${REPO_OWNER}/sungather"
          if [ "${EVENT_NAME}" == "pull_request" ]; then
            TAG="${IMAGE_NAME}:pr-${PR_NUMBER}"
          elif [ "${GIT_REF}" == "refs/heads/main" ]; then
            TAG="${IMAGE_NAME}:latest"
          else
            TAG="${IMAGE_NAME}:${GIT_SHA}"
          fi
          echo "image=${TAG}" >> $GITHUB_OUTPUT
          echo "Building image: ${TAG}"

      - name: Load and push image
        env:
          ARCHIVE: ${{ steps.extract.outputs.archive }}
          IMAGE: ${{ steps.metadata.outputs.image }}
        run: |
          LOADED_ID=$(docker load < "${ARCHIVE}" | grep -oP 'sha256:[a-f0-9]+')
          docker tag "${LOADED_ID}" "${IMAGE}"
          docker push "${IMAGE}"

      - name: Upload rock artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rock
          path: rock/*.rock

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-22.04
    needs: build-rock
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.10'

      - name: Install Concierge
        run: |
          sudo apt-get remove -y docker-ce docker-ce-cli containerd.io
          sudo rm -rf /run/containerd
          sudo snap install concierge --classic

      - name: Set up development environment
        run: sudo concierge prepare -p dev

      - name: Install tox
        run: uv tool install --with=tox-uv tox

      - name: Pack charm
        run: |
          sudo charmcraft pack --destructive-mode
          sudo chown -R $USER:$USER .

      - name: Run integration tests
        run: uv run tox -e integration
        env:
          CHARM_PATH: ${{ github.workspace }}/sungather-k8s_amd64.charm

      - name: Upload charm artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: charm
          path: '*.charm'

      - name: Collect debug logs
        if: failure()
        run: |
          juju debug-log --replay --no-tail > debug-log.txt
          juju status --format=yaml > status.yaml

      - name: Upload debug logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: debug-logs
          path: |
            debug-log.txt
            status.yaml
